# 안드로이드 앱 자동 만들기
# - 올릴 때마다 앱이 제대로 만들어지는지 점검
# - 서명 열쇠(Secrets)를 등록하면 플레이 스토어에 올릴 AAB 파일이 만들어짐 (Actions 실행 결과에서 받기)
name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ['store/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync web files into the app
        run: |
          npm ci
          npm run sync

      - name: Prepare signing key (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Collect store file (only if signed)
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/sudoku-store-1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: sudoku-store-1.0.${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Remove old test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-latest --yes --cleanup-tag || true
