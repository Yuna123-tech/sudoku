<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스도쿠 놀이터</title>
  <meta name="description" content="클래식, 대각선, 하이퍼, 지그소, 킬러, 홀짝 등 8가지 스도쿠를 5단계 난이도로 즐기는 무료 웹 게임">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>9</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스도쿠">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">9</span><span class="brand-text" data-i18n="appName">스도쿠 놀이터</span></div>
    <nav class="top-actions">
      <button class="icon-btn hidden" id="btn-install" data-i18n-title="top.install">📲<span class="lbl" data-i18n="top.install">앱 설치</span></button>
      <button class="icon-btn" id="btn-daily-top" data-i18n-title="top.daily">📅<span class="lbl" data-i18n="top.daily">오늘의 퍼즐</span></button>
      <button class="icon-btn" id="btn-records" data-i18n-title="top.records">📊<span class="lbl" data-i18n="top.records">기록</span></button>
      <button class="icon-btn" id="btn-settings" data-i18n-title="top.settings">⚙️<span class="lbl" data-i18n="top.settings">설정</span></button>
      <button class="icon-btn" id="btn-lang" data-i18n-title="top.lang">🌐<span class="lbl" id="lang-label">English</span></button>
    </nav>
  </header>

  <main class="layout">
    <section class="play">
      <div class="picker">
        <select id="pick-v" data-i18n-aria="side.variants"></select>
        <select id="pick-d" data-i18n-aria="side.difficulty"></select>
        <button class="btn primary" id="btn-new-m" data-i18n="pick.new">새 게임</button>
      </div>

      <div class="status">
        <div class="status-title"><strong id="st-variant">클래식</strong> · <span id="st-diff">보통</span><button class="rule-btn" id="btn-rule" data-i18n-title="pick.rule">?</button><span id="st-daily" class="badge hidden" data-i18n="daily">오늘의 퍼즐</span></div>
        <div class="status-meta">
          <span data-i18n-title="st.mistakes">❌ <b id="st-mistakes">0</b></span>
          <span data-i18n-title="st.hints">💡 <b id="st-hints">0</b></span>
          <span class="timer" data-i18n-title="st.time">⏱ <b id="st-time">00:00</b></span>
          <button class="icon-btn small" id="btn-pause" data-i18n-title="st.pause">⏸</button>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board-box">
          <div class="board" id="board" tabindex="0" data-i18n-aria="board">
            <div class="grid" id="grid"></div>
          </div>
          <div class="overlay hidden" id="overlay">
            <div class="overlay-box" id="overlay-content"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="tools">
          <button class="tool" id="btn-undo"><span class="ti">↶</span><span data-i18n="tool.undo">실행취소</span></button>
          <button class="tool" id="btn-erase"><span class="ti">⌫</span><span data-i18n="tool.erase">지우기</span></button>
          <button class="tool" id="btn-notes"><span class="ti">✎</span><span data-i18n="tool.notes">메모</span><em id="notes-state">끔</em></button>
          <button class="tool" id="btn-autonotes"><span class="ti">✦</span><span data-i18n="tool.autoNotes">자동 메모</span></button>
          <button class="tool" id="btn-hint"><span class="ti">💡</span><span data-i18n="tool.hint">힌트</span></button>
        </div>
        <div class="numpad" id="numpad"></div>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h2 data-i18n="side.variants">스도쿠 종류</h2>
        <div class="variants" id="variants"></div>
        <p class="rule" id="rule"></p>
      </div>
      <div class="card">
        <h2 data-i18n="side.difficulty">난이도</h2>
        <div class="diffs" id="diffs"></div>
        <div class="actions">
          <button class="btn primary" id="btn-new" data-i18n="side.new">새 게임</button>
          <button class="btn" id="btn-daily" data-i18n="side.daily">📅 오늘의 퍼즐</button>
        </div>
        <p class="hint-text"><span data-i18n="side.saveNote">진행 중인 게임과 기록은 이 브라우저에 자동 저장됩니다.</span> · <a href="privacy.html" data-i18n="side.privacy">개인정보처리방침</a></p>
      </div>
      <div class="card keys">
        <h2 data-i18n="side.keys">단축키</h2>
        <ul data-i18n-html="side.keysHtml"></ul>
      </div>
    </aside>
  </main>

  <dialog id="dlg">
    <form method="dialog" class="dlg-inner">
      <div class="dlg-head"><h2 id="dlg-title"></h2><button class="icon-btn" value="close" data-i18n-aria="close">✕</button></div>
      <div id="dlg-body"></div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json" hidden>
  <script src="sudoku.js"></script>
  <script src="i18n.js"></script>
  <script src="ads.js"></script>
  <script src="app.js"></script>
</body>
</html>
