<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스도쿠 놀이터</title>
  <meta name="description" content="클래식, 대각선, 하이퍼, 지그소, 킬러, 홀짝 등 8가지 스도쿠를 5단계 난이도로 즐기는 무료 웹 게임">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>9</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">9</span><span>스도쿠 놀이터</span></div>
    <nav class="top-actions">
      <button class="icon-btn" id="btn-records" title="기록">📊<span class="lbl">기록</span></button>
      <button class="icon-btn" id="btn-settings" title="설정">⚙️<span class="lbl">설정</span></button>
      <button class="icon-btn" id="btn-theme" title="테마 전환">🌓</button>
    </nav>
  </header>

  <main class="layout">
    <section class="play">
      <div class="status">
        <div class="status-title"><strong id="st-variant">클래식</strong> · <span id="st-diff">보통</span><span id="st-daily" class="badge hidden">오늘의 퍼즐</span></div>
        <div class="status-meta">
          <span title="실수">❌ <b id="st-mistakes">0</b></span>
          <span title="힌트">💡 <b id="st-hints">0</b></span>
          <span class="timer" title="시간">⏱ <b id="st-time">00:00</b></span>
          <button class="icon-btn small" id="btn-pause" title="일시정지">⏸</button>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" tabindex="0" aria-label="스도쿠 판">
          <div class="grid" id="grid"></div>
        </div>
        <div class="overlay hidden" id="overlay">
          <div class="overlay-box" id="overlay-content"></div>
        </div>
      </div>

      <div class="tools">
        <button class="tool" id="btn-undo"><span class="ti">↶</span>실행취소</button>
        <button class="tool" id="btn-erase"><span class="ti">⌫</span>지우기</button>
        <button class="tool" id="btn-notes"><span class="ti">✎</span>메모 <em id="notes-state">끔</em></button>
        <button class="tool" id="btn-autonotes"><span class="ti">✦</span>자동 메모</button>
        <button class="tool" id="btn-hint"><span class="ti">💡</span>힌트</button>
      </div>

      <div class="numpad" id="numpad"></div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>스도쿠 종류</h2>
        <div class="variants" id="variants"></div>
        <p class="rule" id="rule"></p>
      </div>
      <div class="card">
        <h2>난이도</h2>
        <div class="diffs" id="diffs"></div>
        <div class="actions">
          <button class="btn primary" id="btn-new">새 게임</button>
          <button class="btn" id="btn-daily">📅 오늘의 퍼즐</button>
        </div>
        <p class="hint-text">진행 중인 게임과 기록은 이 브라우저에 자동 저장됩니다.</p>
      </div>
      <div class="card keys">
        <h2>단축키</h2>
        <ul>
          <li><kbd>1</kbd>–<kbd>9</kbd> 숫자 입력 · <kbd>Del</kbd> 지우기</li>
          <li><kbd>←↑→↓</kbd> 이동 · <kbd>N</kbd> 메모 전환</li>
          <li><kbd>Ctrl</kbd>+<kbd>Z</kbd> 실행취소 · <kbd>H</kbd> 힌트 · <kbd>P</kbd> 일시정지</li>
        </ul>
      </div>
    </aside>
  </main>

  <dialog id="dlg">
    <form method="dialog" class="dlg-inner">
      <div class="dlg-head"><h2 id="dlg-title"></h2><button class="icon-btn" value="close" aria-label="닫기">✕</button></div>
      <div id="dlg-body"></div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json" hidden>
  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
